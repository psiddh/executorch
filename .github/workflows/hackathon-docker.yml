name: Hackathon Docker Images

on:
  push:
    branches:
      - docker

jobs:
  build-basic:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v3

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h

      - name: Patch out sccache from Dockerfile
        working-directory: .ci/docker
        run: |
          # Replace sccache install with a no-op so compilers aren't wrapped
          cat > common/install_cache.sh << 'PATCH'
          #!/bin/bash
          echo "Skipping sccache install (not needed for local/hackathon builds)"
          mkdir -p /opt/cache/bin
          PATCH
          chmod +x common/install_cache.sh

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push basic image
        working-directory: .ci/docker
        run: |
          ./build.sh executorch-ubuntu-22.04-clang12 -t ${{ secrets.DOCKERHUB_USERNAME }}/executorch-hackathon:basic
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/executorch-hackathon:basic

  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v3

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h

      - name: Patch out sccache from Dockerfile
        working-directory: .ci/docker
        run: |
          cat > common/install_cache.sh << 'PATCH'
          #!/bin/bash
          echo "Skipping sccache install (not needed for local/hackathon builds)"
          mkdir -p /opt/cache/bin
          PATCH
          chmod +x common/install_cache.sh

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push android image
        working-directory: .ci/docker
        run: |
          ./build.sh executorch-ubuntu-22.04-clang12-android -t ${{ secrets.DOCKERHUB_USERNAME }}/executorch-hackathon:android
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/executorch-hackathon:android

  build-arm:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v3

      - name: Free up disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          df -h

      - name: Patch out sccache from Dockerfile
        working-directory: .ci/docker
        run: |
          cat > common/install_cache.sh << 'PATCH'
          #!/bin/bash
          echo "Skipping sccache install (not needed for local/hackathon builds)"
          mkdir -p /opt/cache/bin
          PATCH
          chmod +x common/install_cache.sh

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push arm image
        working-directory: .ci/docker
        run: |
          ./build.sh executorch-ubuntu-22.04-arm-sdk -t ${{ secrets.DOCKERHUB_USERNAME }}/executorch-hackathon:arm
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/executorch-hackathon:arm
